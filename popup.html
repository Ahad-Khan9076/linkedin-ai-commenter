<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn AI Commenter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #191919;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #DE5B68;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #333;
    }
    select, input[type="password"], input[type="text"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e0c0c4;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      background: white;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #DE5B68;
      box-shadow: 0 0 0 2px rgba(222, 91, 104, 0.2);
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .row > div { flex: 1; }
    button {
      width: 100%;
      padding: 10px;
      background: #DE5B68;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }
    button:hover { background: #c44a56; }
    button.secondary {
      background: transparent;
      color: #DE5B68;
      border: 1px solid #DE5B68;
      margin-top: 8px;
    }
    button.secondary:hover { background: #fff0f2; }
    .status {
      font-size: 12px;
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .status.success { background: #fff0f2; color: #DE5B68; display: block; border: 1px solid #f5d6da; }
    .status.error { background: #fce8e6; color: #c5221f; display: block; }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: -8px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    a { color: #DE5B68; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc;
      border-radius: 22px;
      transition: 0.2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider { background: #DE5B68; }
    input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#DE5B68"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    LinkedIn AI Commenter
  </h1>
  <p class="subtitle">Smart comments • Gen-Z for funny posts</p>

  <label for="provider">AI Provider</label>
  <select id="provider">
    <option value="xai">xAI Grok (api.x.ai)</option>
    <option value="openai">OpenAI</option>
    <option value="custom">Custom OpenAI-compatible</option>
  </select>

  <label for="apiKey">API Key</label>
  <input type="password" id="apiKey" placeholder="sk-... or xai-...">
  <p class="hint">Stored only in your browser. Get key from <a href="https://console.x.ai" target="_blank">console.x.ai</a> or <a href="https://platform.openai.com" target="_blank">OpenAI</a>.</p>

  <div id="customUrlGroup" style="display:none;">
    <label for="baseUrl">Base URL</label>
    <input type="text" id="baseUrl" placeholder="https://api.example.com/v1">
  </div>

  <label for="model">Model</label>
  <input type="text" id="model" placeholder="grok-3 or gpt-4o-mini" value="grok-3">

  <label for="tone">Default Tone (for non-funny posts)</label>
  <select id="tone">
    <option value="strategic">Strategic & Value-adding</option>
    <option value="engaging">Engaging & Conversational</option>
    <option value="professional">Professional</option>
    <option value="curious">Curious (asks questions)</option>
    <option value="supportive">Supportive & Encouraging</option>
  </select>

  <div class="toggle-row">
    <span>Auto-detect funny posts</span>
    <label class="toggle">
      <input type="checkbox" id="autoFunny" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Show button on every post</span>
    <label class="toggle">
      <input type="checkbox" id="showButton" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button id="saveBtn">Save Settings</button>
  <button class="secondary" id="testBtn">Test Connection</button>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
